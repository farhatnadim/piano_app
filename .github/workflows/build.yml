name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test PianoCoachCore
        run: swift test --package-path Packages/PianoCoachCore

  app:
    name: App (${{ matrix.platform }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build
        run: |
          if [ "${{ matrix.platform }}" = "iOS" ]; then
            DESTINATION="generic/platform=iOS Simulator"
          else
            DESTINATION="generic/platform=macOS"
          fi
          set +e
          xcodebuild build \
            -project PianoCoach.xcodeproj \
            -scheme PianoCoach \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1
          STATUS=$?
          echo "::group::Errors and warnings"
          grep -E "(error|warning):" build.log | sort -u | head -300
          echo "::endgroup::"
          tail -n 20 build.log
          exit $STATUS
      - name: Check bundled web assets
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "PianoCoach.app" | head -1)
          echo "App: $APP"
          find "$APP" -path "*WebAssets*" | sort
          find "$APP" -name "sheet.html" | grep -q WebAssets
          find "$APP" -name "youtube_player.html" | grep -q WebAssets
          find "$APP" -name "opensheetmusicdisplay.min.js" | grep -q WebAssets

  ipad-screenshots:
    name: iPad screenshots
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPad simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          ipads = [d for d in devices if d["name"].startswith("iPad Pro") and "13" in d["name"]] or [d for d in devices if d["name"].startswith("iPad")]
          print(ipads[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project PianoCoach.xcodeproj -scheme PianoCoach -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -100; tail -30 build.log; exit 1; }
          APP=build/Build/Products/Debug-iphonesimulator/PianoCoach.app
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Scene manifest:"; plutil -extract UIApplicationSceneManifest xml1 -o - "$APP/Info.plist"
      - name: Take screenshots
        run: |
          mkdir -p shots
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=com.farhatnadim.PianoCoach
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
            sips -s format jpeg -s formatOptions 70 -Z 1600 "shots/$name.png" --out "shots/$name.jpg" > /dev/null
          }
          shoot 1-keys -screenshot-demo keys
          shoot 2-notes -screenshot-demo notes
          shoot 3-start -screenshot-demo start
          shoot 4-keys-landscape -screenshot-demo keys landscape
          shoot 5-notes-landscape -screenshot-demo notes landscape
          shoot 6-library
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: ipad-screenshots
          path: shots/*.jpg
      # Commits the screenshots to docs/screenshots when the pushed commit's message contains [screenshots].
      - name: Save screenshots to the branch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[screenshots]')
        run: |
          mkdir -p docs/screenshots
          cp shots/*.jpg docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update iPad screenshots [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
