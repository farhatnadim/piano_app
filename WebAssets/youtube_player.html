<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  // Replaced by the app before loading: {"videoId": "...", "start": 0, "origin": "https://...", "muted": false}
  var CONFIG = __PIANO_COACH_CONFIG__;

  function post(message) {
    try { window.webkit.messageHandlers.youtube.postMessage(message); } catch (e) {}
  }

  var player = null;
  var pollTimer = null;

  // Must exist before the API script loads.
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () { post({ type: "error", code: -1 }); };
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      width: "100%",
      height: "100%",
      videoId: CONFIG.videoId,
      playerVars: {
        playsinline: 1,
        enablejsapi: 1,
        origin: CONFIG.origin,
        rel: 0,
        controls: 1,
        fs: 0,
        iv_load_policy: 3,
        cc_load_policy: 0,
        autoplay: 0,
        start: Math.floor(CONFIG.start || 0)
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: function (e) { post({ type: "state", state: e.data, time: safeTime() }); },
        onPlaybackRateChange: function (e) { post({ type: "rate", rate: e.data }); },
        onError: function (e) { post({ type: "error", code: e.data }); },
        onAutoplayBlocked: function () { post({ type: "autoplayBlocked" }); }
      }
    });
  }

  function safeTime() {
    try { return player && player.getCurrentTime ? player.getCurrentTime() : 0; } catch (e) { return 0; }
  }

  function onPlayerReady() {
    if (CONFIG.muted) { player.mute(); }
    post({
      type: "ready",
      duration: player.getDuration(),
      rates: player.getAvailablePlaybackRates(),
      muted: player.isMuted()
    });
    clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (!player || !player.getCurrentTime) { return; }
      post({
        type: "time",
        time: player.getCurrentTime(),
        state: player.getPlayerState(),
        rate: player.getPlaybackRate(),
        duration: player.getDuration(),
        muted: player.isMuted()
      });
    }, 100);
  }

  function has(fn) { return player && typeof player[fn] === "function"; }

  // Every command returns null: YouTube's own return values are not serialisable.
  window.PianoPlayer = {
    play: function () { if (has("playVideo")) { player.playVideo(); } return null; },
    pause: function () { if (has("pauseVideo")) { player.pauseVideo(); } return null; },
    seek: function (seconds) { if (has("seekTo")) { player.seekTo(Math.max(0, seconds), true); } return null; },
    setRate: function (rate) {
      if (!has("setPlaybackRate")) { return 1; }
      player.setPlaybackRate(rate);
      return has("getPlaybackRate") ? player.getPlaybackRate() : rate;
    },
    setMuted: function (muted) {
      if (has("mute")) { if (muted) { player.mute(); } else { player.unMute(); } }
      return null;
    },
    setVolume: function (volume) { if (has("setVolume")) { player.setVolume(volume); } return null; }
  };
</script>
</body>
</html>
